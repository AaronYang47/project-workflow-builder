<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1220" />
    <title>Offline · Falcon Process Building System</title>
    <style>
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #0b1220; color: #e2e8f0; font: 16px system-ui, sans-serif; }
      main { width: min(420px, calc(100vw - 48px)); text-align: center; }
      img { width: 88px; height: 88px; object-fit: contain; }
      h1 { font-size: 24px; line-height: 1.25; }
      p { color: #94a3b8; line-height: 1.6; }
      button { margin-top: 12px; border: 1px solid #38bdf8; border-radius: 10px; padding: 10px 18px; background: #082f49; color: #e0f2fe; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/falcon-app-icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Reconnect to open Falcon Process Building System and access cloud projects.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
